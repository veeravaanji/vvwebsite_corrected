<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - {{ app_name }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #111827; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
        .login-card { background: #ffffff; padding: 2.5rem 2rem; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; border-top: 5px solid #d32f2f; }
        .login-card h2 { color: #111827; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .login-card p { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.8rem; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 0.35rem; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .form-group input:focus { border-color: #d32f2f; box-shadow: 0 0 0 3px rgba(211,47,47,0.15); }
        .btn-login { width: 100%; background: #d32f2f; color: white; border: none; padding: 0.85rem; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background: #b71c1c; }
        .error-msg { background: #fee2e2; color: #dc2626; padding: 0.7rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.2rem; }
        .back-link { display: inline-block; margin-top: 1.2rem; color: #6b7280; text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: #111827; }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fa-solid fa-user-shield" style="font-size: 2.5rem; color: #d32f2f; margin-bottom: 1rem;"></i>
        <h2>Admin Authentication</h2>
        <p>Enter your admin credentials to access data</p>

        {% if error %}
        <div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        </form>

        <a href="/" class="back-link">← Return to Website</a>
    </div>
</body>
</html>
